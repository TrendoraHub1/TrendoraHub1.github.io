<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrendoraHub Admin Panel</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

  <header class="admin-header">

    <h1>TrendoraHub Admin Panel</h1>

    <p>
        Manage and upload products to your website.
    </p>

</header>


<main class="admin-container">

    <form class="product-form">

        <div class="form-group">

            <label>Product Name</label>

            <input
                type="text"
                placeholder="Enter product name"
            >

        </div>


        <div class="form-group">

            <label>Product Price</label>

            <input
                type="text"
                placeholder="$99.99"
            >

        </div>


        <div class="form-group">

            <label>Affiliate Link</label>

            <input
                type="url"
                placeholder="https://example.com"
            >

        </div>


        <div class="form-group">

            <label>Main Category</label>

            <select>

                <option>Gadgets</option>

                <option>Fashion</option>

                <option>Home</option>

                <option>Beauty</option>

            </select>

        </div>


        <div class="form-group">

            <label>Collection Category</label>

            <select>

                <option>Smart Lifestyle Gadgets</option>

                <option>Premium Men's Fashion</option>

                <option>Premium Women's Fashion</option>

                <option>Smart Home Essentials</option>

                <option>Beauty & Lifestyle</option>

                <option>Travel Outdoor Essentials</option>

                <option>Lifestyle Essentials</option>

            </select>

        </div>

        <div class="form-group">

    <label>Product ID</label>

    <input
        type="text"
        id="product-id"
        placeholder="Example: PRD-001"
    >

</div>

        <div class="form-group">

    <label>Product Images</label>

    <input
        type="file"
        id="product-images"
        accept="image/*"
        multiple
    >

</div>

        <div class="form-group">

    <label>Product Video</label>

    <input
        type="file"
        id="product-video"
        accept="video/*"
    >

</div>

        <div class="form-group">

            <label>Short Description</label>

            <textarea
                rows="5"
                placeholder="Write product description..."
            ></textarea>

        </div>


        <button type="submit">

            Publish Product

        </button>

    </form>

    <hr>

<h2>Manage Products</h2>

<div class="admin-actions">

    <button type="button" id="preview-btn">
        Preview Products
    </button>

    <button type="button" id="edit-btn">
        Edit Product
    </button>

    <button type="button" id="delete-btn">
        Delete Product
    </button>

</div>

<div id="product-list">
    
</div>

</main>

    <div id="product-list"></div>

    <script src="admin.js"></script>

</body>

</html>
